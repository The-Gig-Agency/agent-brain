name: Verify Agent Brain

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run smoke:router-recommend:v1
      - run: npm run smoke:intake-recommend-v1
      - run: npm run smoke:router-recommend-http:v1
      - run: npm run smoke:router-recommend-ops:v1
      - run: npm run smoke:outcome-events:v1
      - run: npm run smoke:musicdna-mapper
      - run: npm run eval:frozen:debug:v1
      - run: npm run eval:frozen:media:v1
